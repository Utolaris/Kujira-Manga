# Dev Release CI（仅 dev 分支）
# 官方 actions/* 固定 v6；SDK 安装用 android-actions/setup-android@v4（v3 的 tools 包已废弃）。

name: Dev Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform & build-tools
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export ANDROID_HOME ANDROID_SDK_ROOT
          SDKMANAGER=""
          for c in \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "${SDKMANAGER}" ]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "Missing secret RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p release-key
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > release-key/Kujira-Manga-Key.p12
          test -s release-key/Kujira-Manga-Key.p12

      - name: Assemble Release
        env:
          KUJIRA_MANGA_RELEASE_STORE_PASSWORD: ${{ secrets.KUJIRA_MANGA_RELEASE_STORE_PASSWORD }}
          KUJIRA_MANGA_RELEASE_KEY_PASSWORD: ${{ secrets.KUJIRA_MANGA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KUJIRA_MANGA_RELEASE_STORE_PASSWORD}"
          test -n "${KUJIRA_MANGA_RELEASE_KEY_PASSWORD}"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          cp -f "${apks[@]}" dist/
          ls -la dist
          name="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2- | tr -d '[:space:]')"
          code="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2- | tr -d '[:space:]')"
          echo "version_name=${name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"
          body="dist/release-notes.md"
          awk -v ver="${name}" '
            BEGIN { p=0 }
            $0 == "# v" ver { p=1; print; next }
            p==1 && /^# v[0-9]/ { exit }
            p==1 { print }
          ' CHANGELOG.md > "${body}"
          if [ ! -s "${body}" ]; then
            printf '# v%s\n\nCI build %s (%s)\n' "${name}" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)" > "${body}"
          fi
          echo "notes=${body}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kujira-manga-v${{ steps.apk.outputs.version_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create or update draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version_name }}
          name: v${{ steps.apk.outputs.version_name }}
          body_path: ${{ steps.apk.outputs.notes }}
          files: dist/*.apk
          draft: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
