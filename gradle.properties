# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Target language level: Java 21 (Eclipse Temurin 21).
# Do NOT pin org.gradle.java.home to a machine-local path here: GitHub Actions
# (dev branch CI) resolves JDK via actions/setup-java; local builds use
# scripts/jdk-guard.sh / JAVA_HOME. GraalVM still breaks AGP JdkImageTransform.
# 24GB Apple Silicon + Compose/KSP/R8: 4G heap avoids GC thrash on clean builds.
# CI runners get a smaller override via GRADLE_OPTS / org.gradle.jvmargs env if needed.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Task/project parallelism. Limited for a single-module app, still free.
org.gradle.parallel=true
# Local/CI build cache: clean/branch-switch rebuilds reuse transform & compile outputs.
org.gradle.caching=true
# Configuration cache: skip script/variant configuration on repeated builds.
org.gradle.configuration-cache=true
# Store/load CC entries concurrently (Gradle 9+).
org.gradle.configuration-cache.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# In-process Kotlin: shares the Gradle daemon heap instead of a second compiler
# daemon that fights for RAM during Compose compiles.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# Namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Non-final R ids: faster app-module resource compile, safe for this application.
android.nonFinalResIds=true
